<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#1b2140">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Rock Skimmer">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
html, body { margin: 0; }
body { font: 14px system-ui, sans-serif; }
img { max-width: 100%; }
[hidden] { display: none !important; }
</style>
<title>Rock Skimmer</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Inter:wght@400;600&display=swap">
<style>
/* Layout: one full-screen pond at dusk, a thin HUD at top, the stone in your hand at the bottom. Single dusk look by choice. */
:root {
  --ink: #fff6ea;
  --ink-dim: rgba(255, 246, 234, 0.72);
  --chip: rgba(20, 24, 44, 0.42);
  --sweet: #8fe3a8;
  --warn: #ffb27a;
  --ground: #1b2140;
  --display: "Bricolage Grotesque", "Arial Rounded MT Bold", system-ui, sans-serif;
  --body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  background: var(--ground);
  color: var(--ink);
  font-family: var(--body);
  overflow: hidden;
  overscroll-behavior: none;
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
}
#game {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
  touch-action: none;
}
.hud {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  padding-top: calc(env(safe-area-inset-top, 0px) + 14px);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 12px;
  pointer-events: none;
}
.score { display: flex; flex-direction: column; gap: 2px; }
.label {
  font-size: 11px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--ink-dim);
  font-weight: 600;
}
.big {
  font-family: var(--display);
  font-weight: 800;
  font-size: 56px;
  line-height: 0.95;
  font-variant-numeric: tabular-nums;
  text-shadow: 0 2px 12px rgba(0, 0, 0, 0.25);
}
.sub { font-size: 14px; color: var(--ink-dim); font-variant-numeric: tabular-nums; }
.right { display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }
.best {
  background: var(--chip);
  border-radius: 999px;
  padding: 6px 12px;
  font-size: 13px;
  font-variant-numeric: tabular-nums;
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
}
.best b { font-family: var(--display); font-weight: 800; font-size: 15px; }
.btns { display: flex; gap: 6px; }
.pill {
  white-space: nowrap;
  pointer-events: auto;
  background: var(--chip);
  color: var(--ink);
  border: 0;
  border-radius: 999px;
  padding: 6px 12px;
  font: 600 12px var(--body);
  letter-spacing: 0.04em;
  cursor: pointer;
}
.pill:focus-visible, .card:focus-visible, .done:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.sheet {
  position: fixed;
  inset: 0;
  background: rgba(8, 10, 24, 0.55);
  display: flex;
  justify-content: center;
  align-items: flex-start;
  padding-top: calc(env(safe-area-inset-top, 0px) + 24px);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  z-index: 5;
}
.sheet[hidden], .title[hidden], .next[hidden] { display: none; }
.goal { font-size: 12px; font-weight: 600; color: var(--sweet); text-shadow: 0 1px 6px rgba(0, 0, 0, 0.6); }
.next {
  pointer-events: auto;
  margin-top: 8px;
  border: 0;
  border-radius: 999px;
  padding: 12px 26px;
  background: var(--sweet);
  color: #10241a;
  font: 800 18px var(--display);
  white-space: nowrap;
  cursor: pointer;
  box-shadow: 0 5px 0 #3f9a5c, 0 10px 20px rgba(0, 0, 0, 0.35);
}
.next:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
.card.locked { opacity: 0.5; cursor: not-allowed; }
.title {
  position: fixed;
  inset: 0;
  z-index: 4;
  display: flex;
  align-items: center;
  justify-content: center;
  background: linear-gradient(180deg, rgba(12, 10, 30, 0.35), rgba(12, 10, 30, 0.75));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.title-in { display: flex; flex-direction: column; align-items: center; gap: 14px; text-align: center; }
.logo {
  display: flex;
  flex-direction: column;
  line-height: 0.86;
  font-family: var(--display);
  font-weight: 800;
  font-size: clamp(56px, 19vw, 108px);
  letter-spacing: -0.02em;
  transform: skewY(-6deg);
}
.logo span {
  background: linear-gradient(180deg, #fff3c4 0%, #ffd23f 38%, #ff8a4a 62%, #ff5d8f 100%);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  -webkit-text-stroke: 2px rgba(30, 14, 50, 0.85);
  filter: drop-shadow(0 4px 0 #2ec4b6) drop-shadow(0 10px 18px rgba(0, 0, 0, 0.45));
}
.logo span + span { font-size: 0.62em; letter-spacing: 0.04em; }
.tag { margin: 6px 0 4px; font-size: 16px; color: var(--ink); text-shadow: 0 1px 8px rgba(0, 0, 0, 0.5); }
.play {
  border: 0;
  border-radius: 999px;
  padding: 14px 46px;
  background: var(--sweet);
  color: #10241a;
  font: 800 22px var(--display);
  cursor: pointer;
  box-shadow: 0 6px 0 #3f9a5c, 0 12px 24px rgba(0, 0, 0, 0.35);
}
.play:active { transform: translateY(3px); box-shadow: 0 3px 0 #3f9a5c; }
.play:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
.who { margin: 0; font-size: 13px; color: var(--ink-dim); }
.sheet-in {
  width: 100%;
  max-width: 460px;
  max-height: calc(100% - 40px);
  overflow-y: auto;
  background: rgba(24, 26, 50, 0.95);
  border-radius: 18px;
  padding: 16px;
  display: flex;
  flex-direction: column;
  gap: 10px;
  box-shadow: 0 12px 40px rgba(0, 0, 0, 0.4);
}
.sheet h2 { margin: 4px 0 0; font: 800 20px var(--display); }
.cards { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.card {
  display: flex;
  align-items: center;
  gap: 10px;
  min-width: 0;
  padding: 8px;
  border-radius: 12px;
  border: 2px solid transparent;
  background: rgba(255, 255, 255, 0.07);
  color: var(--ink);
  text-align: left;
  cursor: pointer;
  font: inherit;
}
.card.on { border-color: var(--sweet); background: rgba(143, 227, 168, 0.12); }
.pv { width: 44px; height: 64px; flex: none; }
.sw { width: 44px; height: 44px; border-radius: 8px; flex: none; }
.ct { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.cn { font-weight: 600; font-size: 14px; line-height: 1.2; }
.cb { font-size: 12px; color: var(--ink-dim); line-height: 1.3; }
.done {
  margin-top: 6px;
  padding: 12px;
  border: 0;
  border-radius: 12px;
  background: var(--sweet);
  color: #10241a;
  font: 800 16px var(--display);
  cursor: pointer;
}
.call {
  position: fixed;
  left: 0;
  right: 0;
  top: 30%;
  text-align: center;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  pointer-events: none;
  display: flex;
  flex-direction: column;
  gap: 6px;
  align-items: center;
}
#callMain {
  font-family: var(--display);
  font-weight: 800;
  font-size: clamp(34px, 11vw, 60px);
  line-height: 1;
  text-wrap: balance;
  text-shadow: 0 3px 18px rgba(0, 0, 0, 0.35);
  transition: opacity 0.3s, transform 0.3s;
}
#callTip {
  font-size: 15px;
  max-width: 30ch;
  color: var(--ink);
  text-shadow: 0 1px 8px rgba(0, 0, 0, 0.45);
  text-wrap: balance;
}
.hint {
  position: fixed;
  left: 0;
  right: 0;
  top: 57%;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  text-align: center;
  font-size: 14px;
  color: var(--ink);
  text-shadow: 0 1px 6px rgba(0, 0, 0, 0.6);
  pointer-events: none;
}
.hint .sweet { color: var(--sweet); font-weight: 600; }
.fade { opacity: 0; transform: translateY(6px); }
@media (prefers-reduced-motion: reduce) {
  #callMain { transition: none; }
}
</style>

</head>
<body>
<canvas id="game" aria-label="Pond. Swipe up to throw a stone."></canvas>

<div class="hud">
  <div class="score">
    <span class="label">Skips</span>
    <span class="big" id="skips">0</span>
    <span class="sub" id="dist">Swipe up to throw</span>
  </div>
  <div class="right">
    <div class="best"><span id="place">Pond</span> best <b id="best">0</b> · <span id="bestDist">0 ft</span></div>
    <div class="goal" id="goal">Goal: 8 skips to pass</div>
    <div class="btns">
      <button id="pick" type="button" class="pill">Kids &amp; places</button>
      <button id="sound" type="button" class="pill" aria-label="Change sound">Music + sound</button>
    </div>
  </div>
</div>

<div class="call">
  <div id="callMain" class="fade">&nbsp;</div>
  <div id="callTip"></div>
  <button id="next" type="button" class="next" hidden>On to the river</button>
</div>

<div class="title" id="title">
  <div class="title-in">
    <div class="logo" aria-label="Rock Skimmer"><span>ROCK</span><span>SKIMMER</span></div>
    <p class="tag">Skip stones like it's 1985.</p>
    <button id="play" type="button" class="play">Play</button>
    <button id="titlePick" type="button" class="pill">Kids &amp; places</button>
    <p class="who" id="titleWho">Danny at the pond</p>
  </div>
</div>

<div class="sheet" id="sheet" hidden>
  <div class="sheet-in" role="dialog" aria-label="Pick a kid and a place">
    <h2>Who's throwing?</h2>
    <div class="cards" id="kidCards"></div>
    <h2>Where to?</h2>
    <div class="cards" id="placeCards"></div>
    <button id="done" type="button" class="done">Let's go skip some rocks</button>
  </div>
</div>

<div class="hint" id="hint" style="visibility:hidden">Swipe up to throw. Let go when the stone's tilt is in the <span class="sweet">green</span>.</div>

<script>
(() => {
  const cv = document.getElementById('game');
  const mainCtx = cv.getContext('2d');
  let ctx = mainCtx;
  const $ = id => document.getElementById(id);
  const el = { skips: $('skips'), dist: $('dist'), best: $('best'), bestDist: $('bestDist'),
    callMain: $('callMain'), callTip: $('callTip'), hint: $('hint'), sound: $('sound'),
    place: $('place'), goal: $('goal'), next: $('next'), title: $('title'), play: $('play'), titlePick: $('titlePick'), titleWho: $('titleWho'), pick: $('pick'), sheet: $('sheet'), kidCards: $('kidCards'), placeCards: $('placeCards'), done: $('done') };

  // ---------- storage ----------
  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  };
  let best = { skips: 0, ft: 0 };
  let soundMode = store.get('rs-sound', 'all');
  if (soundMode === true) soundMode = 'all'; else if (soundMode === false) soundMode = 'off';
  if (!['all', 'fx', 'off'].includes(soundMode)) soundMode = 'all';
  let started = false;

  // ---------- view ----------
  let W = 0, H = 0, DPR = 1, horizon = 0, f = 0;
  const CAM_H = 1.4, Z_NEAR = 1.6, SHORE_Z = 62;
  let trees = [], waves = [];
  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = cv.clientWidth; H = cv.clientHeight;
    cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    horizon = H * 0.36;
    f = (H - horizon) * Z_NEAR / CAM_H;
    // tree line along the far shore
    trees = [];
    let x = -20;
    let seed = 7;
    const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
    while (x < W + 20) {
      const w = 10 + rnd() * 26;
      trees.push({ x, w, h: 10 + rnd() * 34 + (rnd() < 0.15 ? 18 : 0) });
      x += w * 0.6;
    }
    waves = [];
    for (let i = 0; i < 70; i++) waves.push({ x: (rnd() - 0.5) * 30, z: 2 + rnd() * 55, len: 0.4 + rnd() * 1.2, ph: rnd() * 6.28 });
  }
  const proj = (x, y, z) => ({ x: W / 2 + x * f / z, y: horizon + (CAM_H - y) * f / z, s: f / z });

  // ---------- audio ----------
  let ac = null;
  function audio() {
    if (soundMode === 'off') return null;
    if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return null; } }
    if (ac.state === 'suspended') ac.resume();
    return ac;
  }
  function plip(n, big) {
    const a = audio(); if (!a) return;
    const t = a.currentTime;
    const o = a.createOscillator(), g = a.createGain();
    const base = big ? 180 : 520 + Math.min(n, 15) * 40;
    o.type = 'sine';
    o.frequency.setValueAtTime(base * 1.8, t);
    o.frequency.exponentialRampToValueAtTime(base * 0.6, t + (big ? 0.35 : 0.09));
    g.gain.setValueAtTime(big ? 0.35 : 0.22, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + (big ? 0.45 : 0.14));
    o.connect(g).connect(a.destination); o.start(t); o.stop(t + 0.5);
    // a little splash hiss
    const len = Math.floor(a.sampleRate * (big ? 0.4 : 0.12));
    const buf = a.createBuffer(1, len, a.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3);
    const s = a.createBufferSource(), sg = a.createGain(), bp = a.createBiquadFilter();
    bp.type = 'bandpass'; bp.frequency.value = big ? 900 : 2600; bp.Q.value = 0.8;
    sg.gain.value = big ? 0.25 : 0.12;
    s.buffer = buf; s.connect(bp).connect(sg).connect(a.destination); s.start(t);
  }
  function clack() {
    const a = audio(); if (!a) return;
    const t = a.currentTime, o = a.createOscillator(), g = a.createGain();
    o.type = 'square'; o.frequency.setValueAtTime(1900, t); o.frequency.exponentialRampToValueAtTime(700, t + 0.05);
    g.gain.setValueAtTime(0.12, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.08);
    o.connect(g).connect(a.destination); o.start(t); o.stop(t + 0.1);
  }
  function whoosh() {
    const a = audio(); if (!a) return;
    const t = a.currentTime, len = Math.floor(a.sampleRate * 0.25);
    const buf = a.createBuffer(1, len, a.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.sin(Math.PI * i / len);
    const s = a.createBufferSource(), g = a.createGain(), lp = a.createBiquadFilter();
    lp.type = 'lowpass'; lp.frequency.value = 1400; g.gain.value = 0.08;
    s.buffer = buf; s.connect(lp).connect(g).connect(a.destination); s.start(t);
  }
  // ---------- 80s soundtrack and place sounds (all synthesized, nothing downloaded) ----------
  let music = null, amb = null, musicTimer = null;
  const NOTE = n => 440 * Math.pow(2, (n - 69) / 12);
  // A minor, F, C, G: one bar each
  const CHORDS = [[57, 60, 64], [53, 57, 60], [48, 52, 55], [55, 59, 62]];
  const BASS = [45, 41, 48, 43];
  function noiseBuf(a, secs) {
    const len = Math.floor(a.sampleRate * secs), b = a.createBuffer(1, len, a.sampleRate), d = b.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    return b;
  }
  // ---------- one song per place, each with its own tempo, instruments and tune ----------
  // pond: slow dreamy synthwave · river: fast bright 80s pop · creek: waltz with plucked strings and flute · street: dark electro-funk
  const SONGS = {
    pond: {
      bpm: 84, bar: 16, chords: [[57, 60, 64], [53, 57, 60], [48, 52, 55], [55, 59, 62]], bass: [45, 41, 48, 43],
      melody: [[0, 76, 6], [6, 74, 2], [8, 72, 8], [16, 72, 6], [22, 69, 2], [24, 77, 8], [32, 76, 8], [40, 79, 4], [44, 76, 4], [48, 74, 12], [60, 71, 4]],
      play(I, s, bar, t, st) {
        const ch = this.chords[bar];
        if (s === 0) I.pad(ch, t, st * 16, 1100, 0.03, 'sawtooth');
        if (s === 0 || s === 8) I.bass(this.bass[bar], t, st * 7, 'sine', 0.16, 400);
        if (s % 4 === 2) I.pluck(ch[(s / 4 | 0) % 3] + 24, t, 0.025, 'sine');
        if (s === 0) I.kick(t, 0.3);
        if (s % 8 === 4) I.hat(t, 0.03);
      },
      lead: { wave: 'triangle', vol: 0.06, vib: 5, echo: true }
    },
    river: {
      bpm: 132, bar: 16, chords: [[60, 64, 67], [55, 59, 62], [57, 60, 64], [53, 57, 60]], bass: [48, 43, 45, 41],
      melody: [[0, 72, 2], [2, 72, 2], [4, 76, 2], [6, 79, 4], [10, 76, 2], [12, 77, 4], [16, 74, 2], [18, 74, 2], [20, 79, 2], [22, 83, 4], [26, 79, 2], [28, 77, 4],
        [32, 76, 2], [34, 76, 2], [36, 72, 2], [38, 69, 4], [42, 72, 2], [44, 76, 4], [48, 77, 2], [50, 76, 2], [52, 74, 2], [54, 72, 6], [60, 74, 4]],
      play(I, s, bar, t, st) {
        const ch = this.chords[bar];
        if (s % 2 === 0) I.bass(this.bass[bar] + (s % 4 === 2 ? 12 : 0), t, st * 1.6, 'square', 0.07, 900);
        if (s === 2 || s === 6 || s === 10 || s === 14) I.stab(ch.map(n => n + 12), t, st * 1.2, 'square', 0.018, 2600);
        if (s % 4 === 0) I.kick(t, 0.5);
        if (s === 4 || s === 12) { I.snare(t, 0.26, 0.15); I.clap(t, 0.12); }
        I.hat(t, s % 2 ? 0.03 : 0.05);
      },
      lead: { wave: 'square', vol: 0.045, vib: 0, echo: false }
    },
    creek: {
      bpm: 96, bar: 12, chords: [[55, 59, 62], [50, 54, 57], [52, 55, 59], [48, 52, 55]], bass: [43, 38, 40, 36],
      melody: [[0, 79, 6], [6, 81, 2], [8, 83, 4], [12, 81, 8], [20, 78, 4], [24, 79, 6], [30, 76, 2], [32, 74, 4], [36, 72, 8], [44, 74, 4]],
      play(I, s, bar, t, st) {
        const ch = this.chords[bar];
        if (s === 0) I.pluck(this.bass[bar], t, 0.12, 'triangle', 1.4);
        if (s === 4 || s === 8) for (const [k, n] of ch.entries()) I.pluck(n + 12, t + k * 0.025, 0.04, 'triangle', 0.9);
        if (s % 2 === 1) I.shaker(t, 0.025);
      },
      lead: { wave: 'sine', vol: 0.07, vib: 7, echo: true }
    },
    street: {
      bpm: 104, bar: 16, chords: [[50, 53, 57], [46, 50, 53], [43, 46, 50], [45, 49, 52]], bass: [38, 34, 31, 33],
      melody: [[0, 62, 4], [8, 65, 2], [10, 64, 2], [12, 62, 4], [24, 69, 8], [32, 62, 4], [40, 65, 4], [44, 67, 4], [56, 61, 8]],
      play(I, s, bar, t, st) {
        const ch = this.chords[bar];
        const bp = { 0: 0, 3: 0, 6: 12, 8: 0, 10: 12, 11: 0, 14: 7 };
        if (s in bp) I.bass(this.bass[bar] + bp[s], t, st * 1.3, 'sawtooth', 0.12, 700, 8);
        if (s === 6 || s === 14) I.stab(ch.map(n => n + 12), t, 0.12, 'sawtooth', 0.03, 1800);
        if (s === 0 || s === 7 || s === 10) I.kick(t, 0.6);
        if (s === 4 || s === 12) I.snare(t, 0.45, 0.18, true);
        if (s % 2 === 0) I.hat(t, 0.025);
      },
      lead: { wave: 'sawtooth', vol: 0.035, vib: 3, echo: true, cut: 1500 }
    }
  };
  const MUSIC = SONGS;
  function startMusic() {
    const a = audio(); if (!a || music || soundMode !== 'all') return;
    const song = SONGS[levelId] || SONGS.pond;
    const out = a.createGain(); out.gain.value = 0.0001;
    out.gain.exponentialRampToValueAtTime(0.55, a.currentTime + 1.2);
    const comp = a.createDynamicsCompressor(); out.connect(comp).connect(a.destination);
    const delay = a.createDelay(); delay.delayTime.value = 60 / song.bpm * 0.75; const fb = a.createGain(); fb.gain.value = 0.3;
    const wet = a.createGain(); wet.gain.value = 0.3; delay.connect(fb).connect(delay); delay.connect(wet).connect(out);
    const nb = noiseBuf(a, 1);
    const st = 60 / song.bpm / 4;
    music = { a, out, next: a.currentTime + 0.1, i: 0 };
    const env = (g, t, peak, atk, dur) => { g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(peak, t + atk); g.gain.exponentialRampToValueAtTime(0.0001, t + dur); };
    const osc = (type, freq, t, dur, vol, cut, atk, q) => {
      const o = a.createOscillator(), g = a.createGain(), f = a.createBiquadFilter();
      o.type = type; o.frequency.value = freq; f.type = 'lowpass'; f.frequency.value = cut || 8000; if (q) f.Q.value = q;
      env(g, t, vol, atk || 0.01, dur);
      o.connect(f).connect(g).connect(out); o.start(t); o.stop(t + dur + 0.05);
      return { o, g };
    };
    const noise = (t, len, vol, type, freq, toDelay) => {
      const s = a.createBufferSource(), f = a.createBiquadFilter(), g = a.createGain();
      s.buffer = nb; f.type = type; f.frequency.value = freq;
      g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + len);
      s.connect(f).connect(g).connect(out); if (toDelay) g.connect(delay);

    };
    const I = {
      pad(notes, t, dur, cut, vol, wave) { for (const n of notes) for (const det of [-7, 7]) { const v = osc(wave, NOTE(n), t, dur, vol, cut, dur * 0.3); v.o.detune.value = det; } },
      bass(n, t, dur, wave, vol, cut, q) { osc(wave, NOTE(n), t, dur, vol, cut, 0.005, q); },
      pluck(n, t, vol, wave, dur) { const v = osc(wave || 'triangle', NOTE(n), t, dur || 0.5, vol, 3000, 0.003); v.g.connect(delay); },
      stab(notes, t, dur, wave, vol, cut) { for (const n of notes) osc(wave, NOTE(n), t, dur, vol, cut, 0.005); },
      kick(t, vol) {
        const o = a.createOscillator(), g = a.createGain();
        o.frequency.setValueAtTime(140, t); o.frequency.exponentialRampToValueAtTime(42, t + 0.16);
        g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.3);
        o.connect(g).connect(out); o.start(t); o.stop(t + 0.32);

      snare(t, vol, len, big) { noise(t, len, vol, 'bandpass', big ? 1400 : 2000, true); if (big) noise(t, 0.3, vol * 0.4, 'lowpass', 900, true); },
      clap(t, vol) { for (const d of [0, 0.012, 0.024]) noise(t + d, 0.06, vol, 'bandpass', 1200); },
      hat(t, vol) { noise(t, 0.04, vol, 'highpass', 7500); },
      shaker(t, vol) { noise(t, 0.07, vol, 'highpass', 5000); }

    const loopLen = song.bar * 4;
    const tick = () => {
      if (!music) return;
      while (music.next < a.currentTime + 0.15) {
        const t = music.next, i = music.i, s = i % song.bar, bar = Math.floor(i / song.bar) % 4;
        song.play(I, s, bar, t, st);
        // the tune plays every other time around, so it doesn't wear out
        const m = melAt[i % loopLen];
        if (m && Math.floor(i / loopLen) % 2 === 1) {
          const L2 = song.lead, v = osc(L2.wave, NOTE(m[0]), t, st * m[1] * 0.95, L2.vol, L2.cut || 5000, 0.02);
          if (L2.vib) { const lfo = a.createOscillator(), lg = a.createGain(); lfo.frequency.value = 5.5; lg.gain.value = L2.vib; lfo.connect(lg).connect(v.o.detune); lfo.start(t + 0.1); lfo.stop(t + st * m[1]); }

    tick(); musicTimer = setInterval(tick, 40);
  }
  function stopMusic() {
    if (!music) return;
    const m = music; music = null; clearInterval(musicTimer);
    try { m.out.gain.setTargetAtTime(0.0001, m.a.currentTime, 0.3); setTimeout(() => m.out.disconnect(), 1500); } catch (e) {}
  }
  // background sounds for each place
  function setAmbience() {
    if (amb) { const old = amb; amb = null; try { old.out.gain.setTargetAtTime(0.0001, old.a.currentTime, 0.4); setTimeout(() => { old.stop(); old.out.disconnect(); }, 1500); } catch (e) {} }
    const a = audio(); if (!a || soundMode === 'off' || !started) return;
    const out = a.createGain(); out.gain.value = 0.0001; out.connect(a.destination);
    out.gain.setTargetAtTime(1, a.currentTime, 0.5);
    const src = a.createBufferSource(); src.buffer = noiseBuf(a, 3); src.loop = true;
    const f = a.createBiquadFilter(), g = a.createGain();
    let timer = null;
    const chirp = (base, len, vol) => {
      const t = a.currentTime + 0.01, o = a.createOscillator(), cg = a.createGain();
      o.frequency.setValueAtTime(base, t); o.frequency.exponentialRampToValueAtTime(base * 1.35, t + len);
      cg.gain.setValueAtTime(0.0001, t); cg.gain.exponentialRampToValueAtTime(vol, t + 0.01); cg.gain.exponentialRampToValueAtTime(0.0001, t + len);
      o.connect(cg).connect(out); o.start(t); o.stop(t + len + 0.02);
    };
    if (levelId === 'pond') {           // soft water and crickets
      f.type = 'lowpass'; f.frequency.value = 500; g.gain.value = 0.03;
      timer = setInterval(() => { for (let k = 0; k < 3; k++) setTimeout(() => chirp(4300, 0.035, 0.012), k * 55); }, 900);
    } else if (levelId === 'river') {   // steady rushing water
      f.type = 'lowpass'; f.frequency.value = 900; g.gain.value = 0.07;
    } else if (levelId === 'creek') {   // babbling water and birds
      f.type = 'bandpass'; f.frequency.value = 1200; f.Q.value = 0.7; g.gain.value = 0.05;
      timer = setInterval(() => { if (Math.random() < 0.5) { chirp(2600 + Math.random() * 1400, 0.09, 0.02); setTimeout(() => chirp(3200 + Math.random() * 900, 0.07, 0.016), 130); } }, 1100);
    } else {                            // rain on the street
      f.type = 'highpass'; f.frequency.value = 2200; g.gain.value = 0.045;
    }
    src.connect(f).connect(g).connect(out); src.start();
    amb = { a, out, stop() { try { src.stop(); } catch (e) {} if (timer) clearInterval(timer); } };
  }
  function cheer() {
    const a = audio(); if (!a) return;
    [72, 76, 79, 84].forEach((n, k) => {
      const t = a.currentTime + k * 0.09, o = a.createOscillator(), g = a.createGain();
      o.type = 'square'; o.frequency.value = NOTE(n);
      g.gain.setValueAtTime(0.06, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.25);

  }
  const SOUND_LABEL = { all: 'Music + sound', fx: 'Sound only', off: 'Muted' };

  // ---------- game state ----------
  const G = 9.8;
  let SWEET_LO = 8, SWEET_HI = 32, TILT_PERIOD = 2.8;
  let state = 'ready';     // ready | flying | done
  let clock = 0, tilt = 20, throwTilt = 20, throwMph = 0;

  const tiltAt = t => 20 + 20 * Math.sin(t * Math.PI * 2 / TILT_PERIOD);
  let Q_FLOOR = 0.35, Q_FALL = 24;
  // anywhere in the green is a perfect release; outside it the throw gets worse, faster on later levels
  const quality = t => { const off = t < SWEET_LO ? SWEET_LO - t : t > SWEET_HI ? t - SWEET_HI : 0; return Math.max(Q_FLOOR, 1 - off / Q_FALL); };
  const feet = m => Math.round(m * 3.281);

  function showCall(main, tip) {

  function hideCall() { el.callMain.classList.add('fade'); el.callTip.textContent = ''; }

  // the swipe starts the kid's throw; the stone leaves the hand at the release point
  function throwStone(power, aim) {
    throwTilt = tilt;

  }
  function launch(power, aim) {
    const vz = power;
    const elev = 4 * Math.PI / 180;
    rock = { x: (W * 0.42 - W / 2) * 0.9 / f, y: 0.9, z: 0.6, vx: aim * vz, vy: vz * Math.tan(elev), vz, spin: 0 };
    throwMph = Math.round(vz * 2.237);
    skips = 0; maxZ = 0; state = 'flying';
    el.skips.textContent = '0';
    el.dist.textContent = `${throwMph} mph · tilt ${Math.round(throwTilt)}°`;
    el.hint.style.visibility = 'hidden';
    hideCall();
    whoosh();
  }

  function addRipple(x, z, big) {
    ripples.push({ x, z, t: 0, big });
    const n = big ? 18 : 7;
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2, sp = (big ? 1.4 : 0.8) * Math.random();
      drops.push({ x, y: 0.02, z, vx: Math.cos(a) * sp, vz: Math.sin(a) * sp, vy: (big ? 2.6 : 1.5) * (0.5 + Math.random()), life: 1 });
    }
  }

  const OBST_MSG = {
    pad: ['Plop! Lily pad.', 'a lily pad', 'Aim between the lily pads.'],
    frog: ['Ribbit!', 'a frog!', 'The frogs hop off when a stone lands close by.'],
    log: ['Thunk!', 'a log', 'Logs float down the river. Time your throw.'],
    duck: ['Squeak!', 'the rubber duck', 'Somebody lost their rubber duck.'],
    boat: ['Sunk the paper boat!', 'the paper boat', 'Somebody folded that boat out of notebook paper.'],
    bobber: ['Hey! You scared my fish!', "the fisherman's bobber", 'Leave the fisherman alone.'],
    ducks: ['Quack quack!', 'the duck family', 'Wait for the ducks to swim past.'],
    reeds: ['Stuck in the reeds.', 'the reeds', 'Throw around the cattails.'],
    canoe: ['Bonk! Hit the canoe.', 'a canoe', 'Wait for the canoe to paddle by.'],
    wader: ['Hey! Watch it, kid!', 'the fisherman', 'Give the fisherman some room.'],

  function finish(sunk, why) {
    state = 'done'; doneAt = clock;
    const ft = feet(maxZ);
    el.dist.textContent = `${ft} ft · ${throwMph} mph · tilt ${Math.round(throwTilt)}°`;
    let newBest = false;
    if (skips > best.skips || (skips === best.skips && ft > best.ft)) { best = { skips, ft }; store.set('rs-best-' + levelId, best); newBest = skips > 0; }
    let passedNow = false;
    if (skips >= L.goal && !passed.includes(levelId)) { passed.push(levelId); store.set('rs-passed', passed); passedNow = true; burst(); cheer(); }
    else if (newBest) { burst(); cheer(); }
    renderBest();
    let main, tip = '';
    if (skips === 0) {
      main = 'Plunk.';
      tip = why === 'steep' ? 'It hit too steep. Swipe faster for a flatter throw.' : 'Tilt was off. Let go while the stone is in the green.';
    } else {
      main = skips === 1 ? '1 skip' : `${skips} skips`;
      if (newBest) tip = 'New best!';
      else if (skips < 5 && quality(throwTilt) < 0.5) tip = 'Let go while the tilt is in the green for more skips.';
      else if (skips < 5) tip = 'Swipe faster to get more skips.';
      else if (skips >= 12) tip = 'Now that is a skipper.';
    }

    if (why === 'bank') {
      const what = L.banks.kind === 'curb' ? 'the curb' : 'the mud';
      main = skips ? `${ss}, then ${what}` : (L.banks.kind === 'curb' ? 'Hit the curb!' : 'Into the mud!');
      tip = newBest ? 'New best!' : 'Swipe straighter to keep it on the water.';
    } else if (OBST_MSG[why]) {
      const [m0, m1, tp] = OBST_MSG[why];
      main = skips ? `${ss}, then ${m1}` : m0;

    } else if (why === 'rock') {

      tip = next ? `You unlocked the ${LEVELS[next].short.toLowerCase()}.` : 'You beat every level. You are the skipping champ of the neighborhood.';

  function step(dt) {

        r.spin += h * 30;

  // ---------- drawing ----------
  function drawSky() {
    const g = ctx.createLinearGradient(0, 0, 0, horizon);
    for (const [a, c] of L.sky) g.addColorStop(a, c);
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, horizon + 1);
    if (L.sun) {
      const sx = W * L.sun.x, sy = horizon * L.sun.fy;
      const sg = ctx.createRadialGradient(sx, sy, 4, sx, sy, 110);

      b.type = 'button'; b.className = 'card' + (id === levelId ? ' on' : '');
      b.setAttribute('aria-pressed', String(id === levelId));
      const sky = P.sky.map(([a, c]) => `${c} ${Math.round(a * 45)}%`).join(', ');
      const water = P.water.map(([a, c]) => `${c} ${45 + Math.round(a * 55)}%`).join(', ');
      const n = LEVEL_IDS.indexOf(id), prev = LEVEL_IDS[n - 1], locked = !isOpen(id);
      if (locked) { b.disabled = true; b.classList.add('locked'); }
      const status = locked ? `Locked. Skip ${LEVELS[prev].goal} at the ${LEVELS[prev].short.toLowerCase()} to open.`
        : passed.includes(id) ? `Passed ✓ · best ${pb ? pb.skips : 0}` : `Goal ${P.goal} skips${pb && pb.skips ? ` · best ${pb.skips}` : ''}`;
      b.innerHTML = `<span class="sw" style="background:linear-gradient(180deg, ${sky}, ${water})"></span><span class="ct"><span class="cn">Level ${n + 1}: ${P.short}</span><span class="cb">${status}</span></span>`;
      b.addEventListener('click', () => { if (!locked) { setLevel(id); buildPicker(); } });
      el.placeCards.appendChild(b);
    }
  }
  function isOpen(id) { const n = LEVEL_IDS.indexOf(id); return n === 0 || passed.includes(LEVEL_IDS[n - 1]); }
  function applyDifficulty() { SWEET_LO = L.sweet[0]; SWEET_HI = L.sweet[1]; TILT_PERIOD = L.period; Q_FLOOR = L.qFloor; Q_FALL = L.qFall; }
  function setLevel(id) {
    el.next.hidden = true;
    levelId = id; L = LEVELS[id]; store.set('rs-level', id);
    ripples = []; drops = []; rainRings = [];
    resetObstacles();
    if (state !== 'ready') { state = 'ready'; rock = null; pending = null; el.hint.style.visibility = 'visible'; }
    el.skips.textContent = '0'; el.dist.textContent = 'Swipe up to throw';
    applyDifficulty();
    loadBest(); renderBest();
    setAmbience();
    if (started && soundMode === 'all') { stopMusic(); setTimeout(startMusic, 400); }
  }
  function openSheet() { buildPicker(); el.sheet.hidden = false; drag = null; }
  function closeSheet() { el.sheet.hidden = true; if (started) showCall(L.name, L.tip); else renderTitle(); }
  function renderTitle() { el.titleWho.textContent = `${K.name} at the ${L.short.toLowerCase()}`; }
  function startGame() {
    started = true; el.title.hidden = true; el.hint.style.visibility = 'visible';
    audio();
    if (soundMode === 'all') startMusic();
    setAmbience();
    showCall(L.name, `${L.tip} Goal: ${L.goal} skips.`);
  }
  el.play.addEventListener('click', startGame);
  el.titlePick.addEventListener('click', openSheet);
  renderTitle();
  for (const b of [el.pick]) b.addEventListener('pointerdown', e => e.stopPropagation());
  el.pick.addEventListener('click', e => { e.stopPropagation(); openSheet(); });
  el.done.addEventListener('click', closeSheet);
  el.next.addEventListener('pointerdown', e => e.stopPropagation());
  el.next.addEventListener('click', e => { e.stopPropagation(); const to = el.next.dataset.to; setLevel(to); showCall(L.name, `${L.tip} Goal: ${L.goal} skips.`); });
  el.sheet.addEventListener('click', e => { if (e.target === el.sheet) closeSheet(); });
  renderBest();

  // ---------- loop ----------
  window.addEventListener('resize', resize);
  resize();
  resetObstacles();
  // a small sample ripple so the pond looks alive on first view
  addRipple(-1.2, 14, false); ripples[0].t = 0.8; drops = [];
  let lastT = performance.now();
  // ---------- final frame: the drawn scene plus a light paper grain ----------
  let grain = null;
  function render() {
    {
      draw();
      if (!grain) {
        const g = document.createElement('canvas'); g.width = g.height = 96;
        const gc = g.getContext('2d'), id = gc.createImageData(96, 96);
        for (let i = 0; i < id.data.length; i += 4) { const v = Math.random() * 255; id.data[i] = id.data[i + 1] = id.data[i + 2] = v; id.data[i + 3] = 255; }
        gc.putImageData(id, 0, 0); grain = mainCtx.createPattern(g, 'repeat');
      }
      ctx.save(); ctx.globalAlpha = 0.045; ctx.globalCompositeOperation = 'overlay'; ctx.fillStyle = grain; ctx.fillRect(0, 0, W, H); ctx.restore();
    }
  }
  function frame(now) {
    const dt = Math.min((now - lastT) / 1000, 1 / 30); lastT = now;
    step(dt); render();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

})();
</script>

<script>
if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
</script>
</body>
